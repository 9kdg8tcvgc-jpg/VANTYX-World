
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANTYX | Your World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#101827}
h1{margin:0;color:#62d9ff;letter-spacing:4px;font-size:25px}
#status{font-size:12px;color:#b5c7d8}
main{position:relative}
canvas{display:block;width:100%;height:calc(100dvh - 130px)}
#panel{position:absolute;left:12px;top:12px;background:#101827dd;padding:12px;border:1px solid #34475c;border-radius:12px;max-width:240px}
button{background:#16314a;color:white;border:1px solid #62d9ff;border-radius:8px;padding:10px;cursor:pointer}
footer{height:62px;display:flex;justify-content:center;align-items:center;gap:12px;color:#c8d6e4;font-size:13px}
</style>
</head>
<body>
<header>
<h1>VANTYX</h1>
<span id="status">Starting world...</span>
</header>
<main>
<canvas id="world"></canvas>
<div id="panel">
<strong>OPEN WORLD</strong>
<p>Explore your new city.</p>
<button id="camera">Change camera</button>
<p>Move: W A S D or arrow keys</p>
</div>
</main>
<footer>YOUR WORLD. YOUR STORY.</footer>

<script type="module">
const status=document.querySelector("#status");
const canvas=document.querySelector("#world");

async function start(){
try{
const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js");
const scene=new THREE.Scene();
scene.background=new THREE.Color("#9cc9df");
scene.fog=new THREE.Fog("#9cc9df",35,130);

const camera=new THREE.PerspectiveCamera(70,1,0.1,300);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x526b58,2));
const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(20,35,15);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshStandardMaterial({color:0x488b57})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const roadMat=new THREE.MeshStandardMaterial({color:0x303945});
function road(x,z,w,d){
const r=new THREE.Mesh(new THREE.BoxGeometry(w,0.08,d),roadMat);
r.position.set(x,0.02,z);scene.add(r);
}
road(0,0,12,200);
road(0,0,200,12);

for(let i=0;i<50;i++){
const x=(Math.random()-.5)*100;
const z=(Math.random()-.5)*100;
if(Math.abs(x)<10||Math.abs(z)<10)continue;
const h=4+Math.random()*18;
const colors=[0x9caec0,0xd0b9a0,0x647c91,0xe0e5ea,0x4d6578];
const b=new THREE.Mesh(
new THREE.BoxGeometry(4+Math.random()*4,h,4+Math.random()*4),
new THREE.MeshStandardMaterial({color:colors[i%colors.length]})
);
b.position.set(x,h/2,z);
b.castShadow=true;
scene.add(b);
}

const player=new THREE.Group();
const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.45,0.8,4,8),
new THREE.MeshStandardMaterial({color:0x14bfff})
);
body.position.y=1.05;
player.add(body);
const head=new THREE.Mesh(
new THREE.SphereGeometry(.3,16,12),
new THREE.MeshStandardMaterial({color:0xffd0a2})
);
head.position.y=1.8;
player.add(head);
scene.add(player);

let yaw=0,first=false;
const keys={};
const speed=10;
const clock=new THREE.Clock();

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.key.startsWith("Arrow"))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

document.querySelector("#camera").onclick=()=>{
first=!first;
};

function resize(){
const w=canvas.clientWidth,h=canvas.clientHeight;
renderer.setSize(w,h,false);
camera.aspect=w/h;
camera.updateProjectionMatrix();
}
addEventListener("resize",resize);
resize();

status.textContent="World ready!";

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
let f=0,s=0;
if(keys.w||keys.arrowup)f++;
if(keys.s||keys.arrowdown)f--;
if(keys.d||keys.arrowright)s++;
if(keys.a||keys.arrowleft)s--;

if(f||s){
const len=Math.hypot(f,s);f/=len;s/=len;
player.position.x+=s*speed*dt;
player.position.z+=f*speed*dt;
yaw=Math.atan2(-s,-f);
player.rotation.y=yaw;
}

if(first){
camera.position.set(player.position.x,player.position.y+1.6,player.position.z);
camera.rotation.set(0,yaw,0);
}else{
camera.position.set(
player.position.x+Math.sin(yaw)*7,
player.position.y+4,
player.position.z-Math.cos(yaw)*7
);
camera.lookAt(player.position.x,player.position.y+1,player.position.z);
}
renderer.render(scene,camera);
}
animate();
}catch(err){
console.error(err);
status.textContent="World failed to load. Check your internet connection.";
}
}
start();
</script>
</body>
</html>
